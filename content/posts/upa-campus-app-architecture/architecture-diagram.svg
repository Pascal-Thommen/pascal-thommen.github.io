<svg width="1200" height="650" viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="clientBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="coreBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="dbBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="aiBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="tunnelBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="650" fill="url(#bg)" />

  <!-- Subtle Technical Grid -->
  <g opacity="0.06">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200 M0 420 H1200 M0 480 H1200 M0 540 H1200 M0 600 H1200" stroke="#94a3b8" stroke-width="1" />
    <path d="M60 0 V650 M120 0 V650 M180 0 V650 M240 0 V650 M300 0 V650 M360 0 V650 M420 0 V650 M480 0 V650 M540 0 V650 M600 0 V650 M660 0 V650 M720 0 V650 M780 0 V650 M840 0 V650 M900 0 V650 M960 0 V650 M1020 0 V650 M1080 0 V650 M1140 0 V650" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(50, 36)">
    <rect x="0" y="0" width="230" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="115" y="16" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">ENTERPRISE ARCHITECTURE</text>
    <text x="0" y="54" fill="#f8fafc" font-size="25" font-weight="800" letter-spacing="-0.4">UPA Campus Progressive Web App (v1.0.0)</text>
    <text x="0" y="76" fill="#94a3b8" font-size="13.5" font-weight="400">Zero-Trust WireGuard Ingress, Single-Origin Container Stack, PostgreSQL 16 &amp; Multimodal AI</text>
  </g>

  <!-- ================= LEFT COLUMN: Clients & Zero-Trust Ingress ================= -->
  <g transform="translate(50, 138)">
    <!-- Card 1: Mobile First Campus PWA -->
    <rect width="310" height="146" rx="12" fill="#131c2e" stroke="url(#clientBorder)" stroke-width="1.8" />
    <rect x="18" y="16" width="28" height="28" rx="7" fill="#0284c7" fill-opacity="0.25" />
    <text x="32" y="35" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle">PWA</text>
    <text x="56" y="27" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.4">CLIENT LAYER (STUDENTS)</text>
    <text x="56" y="44" fill="#f8fafc" font-size="15" font-weight="700">Mobile First Campus PWA</text>
    <g transform="translate(18, 58)">
      <rect x="0" y="0" width="274" height="22" rx="4" fill="#0f172a" />
      <text x="10" y="15" fill="#e2e8f0" font-size="11">• Service Worker (sw.js) Offline App Shell</text>
      <rect x="0" y="28" width="274" height="22" rx="4" fill="#0f172a" />
      <text x="10" y="43" fill="#e2e8f0" font-size="11">• Inicio Feed, 1-Click RSVP &amp; Emergency Banner</text>
      <rect x="0" y="56" width="274" height="22" rx="4" fill="#0f172a" />
      <text x="10" y="71" fill="#e2e8f0" font-size="11">• Agenda Calendar &amp; Web Push (FCM HTTP v1)</text>
    </g>

    <!-- Card 2: Web-Admin Cockpit -->
    <g transform="translate(0, 162)">
      <rect width="310" height="122" rx="12" fill="#131c2e" stroke="url(#clientBorder)" stroke-width="1.8" />
      <rect x="18" y="16" width="28" height="28" rx="7" fill="#0284c7" fill-opacity="0.25" />
      <text x="32" y="35" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle">CMS</text>
      <text x="56" y="27" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.4">ADMINISTRATION (/dashboard/)</text>
      <text x="56" y="44" fill="#f8fafc" font-size="15" font-weight="700">Web-Admin Editorial Cockpit</text>
      <g transform="translate(18, 58)">
        <rect x="0" y="0" width="274" height="22" rx="4" fill="#0f172a" />
        <text x="10" y="15" fill="#e2e8f0" font-size="11">• Unified Editor &amp; Client WebP Compression</text>
        <rect x="0" y="28" width="274" height="22" rx="4" fill="#0f172a" />
        <text x="10" y="43" fill="#e2e8f0" font-size="11">• 6-Module RBAC Matrix &amp; Telemetry</text>
      </g>
    </g>

    <!-- Card 3: NetBird + Nginx Ingress -->
    <g transform="translate(0, 300)">
      <rect width="310" height="130" rx="12" fill="#131c2e" stroke="url(#tunnelBorder)" stroke-width="1.8" />
      <rect x="18" y="16" width="28" height="28" rx="7" fill="#d97706" fill-opacity="0.25" />
      <text x="32" y="35" fill="#fbbf24" font-size="12" font-weight="800" text-anchor="middle">WG</text>
      <text x="56" y="27" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="0.4">ZERO-TRUST NETWORK BOUNDARY</text>
      <text x="56" y="44" fill="#f8fafc" font-size="14" font-weight="700">NetBird Tunnel &amp; Nginx Proxy</text>
      <g transform="translate(18, 58)">
        <rect x="0" y="0" width="274" height="22" rx="4" fill="#0f172a" />
        <text x="10" y="15" fill="#fde68a" font-size="11">• Outbound WireGuard Mesh (0 Open Ports)</text>
        <rect x="0" y="28" width="274" height="22" rx="4" fill="#0f172a" />
        <text x="10" y="43" fill="#fde68a" font-size="11">• Single-Origin Proxy (127.0.0.1:8085)</text>
      </g>
    </g>
  </g>

  <!-- Connector: Left to Center -->
  <path d="M360 210 H412" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="5 4" />
  <polygon points="418,210 409,205 409,215" fill="#38bdf8" />
  <path d="M360 360 H412" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="5 4" />
  <polygon points="418,360 409,355 409,365" fill="#38bdf8" />
  <path d="M360 500 H412" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="5 4" />
  <polygon points="418,500 409,495 409,505" fill="#f59e0b" />

  <!-- ================= CENTER COLUMN: FastAPI Core & PostgreSQL 16 ================= -->
  <g transform="translate(420, 138)">
    <!-- Soft Glow -->
    <rect x="-8" y="-8" width="376" height="256" rx="16" fill="#1d4ed8" opacity="0.14" filter="url(#glow)" />
    <!-- FastAPI Card -->
    <rect width="360" height="240" rx="14" fill="#0f172a" stroke="url(#coreBorder)" stroke-width="2.4" />
    <rect x="0" y="0" width="360" height="54" rx="14" fill="url(#primaryGlow)" />
    <rect x="18" y="13" width="30" height="30" rx="8" fill="#2563eb" fill-opacity="0.3" />
    <text x="33" y="33" fill="#60a5fa" font-size="13" font-weight="800" text-anchor="middle">API</text>
    <text x="58" y="24" fill="#60a5fa" font-size="11.5" font-weight="700" letter-spacing="0.6">APPLICATION CORE (CONTAINER 2)</text>
    <text x="58" y="42" fill="#ffffff" font-size="17" font-weight="800">FastAPI Backend (Python 3.12)</text>

    <g transform="translate(18, 66)">
      <rect x="0" y="0" width="324" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="15" fill="#38bdf8" font-size="11.5" font-weight="700">1. Routing &amp; Pydantic v2 Validation</text>
      <text x="12" y="28" fill="#94a3b8" font-size="10.5">OpenAPI 3.1 Contracts, Pin Expiry &amp; Schema Guards</text>

      <rect x="0" y="42" width="324" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="57" fill="#60a5fa" font-size="11.5" font-weight="700">2. Service Layer &amp; Least-Privilege RBAC</text>
      <text x="12" y="70" fill="#94a3b8" font-size="10.5">JWT HS256 Auth, Instagram Write-Lock &amp; Background Sync</text>

      <rect x="0" y="84" width="324" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="99" fill="#34d399" font-size="11.5" font-weight="700">3. Repository Layer &amp; Media Streaming</text>
      <text x="12" y="112" fill="#94a3b8" font-size="10.5">SQLAlchemy 2.0 Prepared Statements &amp; 64KB Chunk Upload</text>

      <rect x="0" y="126" width="324" height="32" rx="6" fill="#172554" stroke="#1d4ed8" stroke-width="1" />
      <text x="162" y="146" fill="#bfdbfe" font-size="11" font-weight="600" text-anchor="middle">Zero-Mock Verified • Pytest &amp; Ruff Gatekeeper</text>
    </g>

    <!-- Connector FastAPI to PostgreSQL -->
    <path d="M180 240 V268" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3" />
    <polygon points="180,274 175,265 185,265" fill="#10b981" />

    <!-- PostgreSQL 16 Card -->
    <g transform="translate(0, 276)">
      <rect width="360" height="154" rx="14" fill="#0f172a" stroke="url(#dbBorder)" stroke-width="2.2" />
      <rect x="18" y="14" width="30" height="30" rx="8" fill="#059669" fill-opacity="0.25" />
      <text x="33" y="34" fill="#34d399" font-size="13" font-weight="800" text-anchor="middle">SQL</text>
      <text x="58" y="24" fill="#34d399" font-size="11.5" font-weight="700" letter-spacing="0.6">SINGLE SOURCE OF TRUTH (CONTAINER 3)</text>
      <text x="58" y="42" fill="#ffffff" font-size="15" font-weight="800">PostgreSQL 16 &amp; Docker Volumes</text>

      <g transform="translate(18, 56)">
        <rect x="0" y="0" width="156" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="10" y="17" fill="#6ee7b7" font-size="11" font-weight="700">Unified Post Schema</text>
        <text x="10" y="32" fill="#94a3b8" font-size="10">Feed + Calendar in 1 Row</text>

        <rect x="168" y="0" width="156" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="178" y="17" fill="#6ee7b7" font-size="11" font-weight="700">Unique Constraints</text>
        <text x="178" y="32" fill="#94a3b8" font-size="10">Idempotent RSVP &amp; Views</text>

        <rect x="0" y="48" width="324" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="12" y="69" fill="#e2e8f0" font-size="10.2">Alembic Migrations • Persistent Volumes (postgres_data, uploads)</text>
      </g>
    </g>
  </g>

  <!-- Connector: Center to Right -->
  <path d="M780 205 H832" stroke="#a855f7" stroke-width="2.2" stroke-dasharray="5 4" />
  <polygon points="838,205 829,200 829,210" fill="#a855f7" />
  <path d="M780 355 H832" stroke="#60a5fa" stroke-width="2.2" stroke-dasharray="5 4" />
  <polygon points="838,355 829,350 829,360" fill="#60a5fa" />
  <path d="M780 500 H832" stroke="#10b981" stroke-width="2.2" stroke-dasharray="5 4" />
  <polygon points="838,500 829,495 829,505" fill="#10b981" />

