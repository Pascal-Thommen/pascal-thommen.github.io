  <g transform="translate(840, 138)">
    <!-- Card 1: Multimodal AI -->
    <rect width="310" height="138" rx="12" fill="#131c2e" stroke="url(#aiBorder)" stroke-width="1.8" />
    <rect x="18" y="16" width="28" height="28" rx="7" fill="#7e22ce" fill-opacity="0.25" />
    <text x="32" y="35" fill="#c084fc" font-size="13" font-weight="800" text-anchor="middle">AI</text>
    <text x="56" y="27" fill="#c084fc" font-size="12" font-weight="700" letter-spacing="0.4">MULTIMODAL EXTRACTION</text>
    <text x="56" y="44" fill="#f8fafc" font-size="15" font-weight="700">Google Gemini Flash</text>
    <g transform="translate(18, 58)">
      <rect x="0" y="0" width="274" height="22" rx="4" fill="#0f172a" />
      <text x="10" y="15" fill="#e9d5ff" font-size="11">• Poster Vision &amp; Caption Event Parsing</text>
      <rect x="0" y="28" width="274" height="22" rx="4" fill="#0f172a" />
      <text x="10" y="43" fill="#e9d5ff" font-size="11">• 1-Click Editorial Form Autocomplete</text>
      <rect x="0" y="56" width="274" height="14" rx="3" fill="#0f172a" opacity="0" />
    </g>

    <!-- Card 2: Google OAuth & Classroom -->
    <g transform="translate(0, 154)">
      <rect width="310" height="138" rx="12" fill="#131c2e" stroke="url(#coreBorder)" stroke-width="1.8" />
      <rect x="18" y="16" width="28" height="28" rx="7" fill="#2563eb" fill-opacity="0.25" />
      <text x="32" y="35" fill="#60a5fa" font-size="12" font-weight="800" text-anchor="middle">SSO</text>
      <text x="56" y="27" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="0.4">IDENTITY &amp; ACADEMIC SYNC</text>
      <text x="56" y="44" fill="#f8fafc" font-size="14" font-weight="700">Google OAuth 2.0 &amp; Classroom</text>
      <g transform="translate(18, 58)">
        <rect x="0" y="0" width="274" height="22" rx="4" fill="#0f172a" />
        <text x="10" y="15" fill="#dbeafe" font-size="11">• OAuth 2.0 Domain Lock (@upa.edu.py)</text>
        <rect x="0" y="28" width="274" height="22" rx="4" fill="#0f172a" />
        <text x="10" y="43" fill="#dbeafe" font-size="11">• Classroom Deadlines Sync &amp; DB Cache</text>
      </g>
    </g>

    <!-- Card 3: Web Push & Instagram -->
    <g transform="translate(0, 308)">
      <rect width="310" height="122" rx="12" fill="#131c2e" stroke="url(#dbBorder)" stroke-width="1.8" />
      <rect x="18" y="16" width="28" height="28" rx="7" fill="#059669" fill-opacity="0.25" />
      <text x="32" y="35" fill="#34d399" font-size="11" font-weight="800" text-anchor="middle">SYNC</text>
      <text x="56" y="27" fill="#34d399" font-size="12" font-weight="700" letter-spacing="0.4">NOTIFICATIONS &amp; SOCIAL FEED</text>
      <text x="56" y="44" fill="#f8fafc" font-size="15" font-weight="700">FCM Push &amp; Instagram Sync</text>
      <g transform="translate(18, 58)">
        <rect x="0" y="0" width="274" height="22" rx="4" fill="#0f172a" />
        <text x="10" y="15" fill="#d1fae5" font-size="11">• Firebase Cloud Messaging (Web Push)</text>
        <rect x="0" y="28" width="274" height="22" rx="4" fill="#0f172a" />
        <text x="10" y="43" fill="#d1fae5" font-size="11">• @upalemana Feed Ingestion &amp; Local Media</text>
      </g>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(50, 616)">
    <text x="0" y="0" fill="#64748b" font-size="11.5" font-weight="500">Pascal Thommen • Project Lead, System Architecture &amp; Backend Implementation</text>
    <text x="1100" y="0" fill="#64748b" font-size="11.5" font-weight="500" text-anchor="end">pascal-thommen.github.io</text>
  </g>
</svg>
