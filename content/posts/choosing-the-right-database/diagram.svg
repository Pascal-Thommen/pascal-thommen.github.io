
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="accentBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cacheBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="olapBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="edgeBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid pattern overlay -->
  <g opacity="0.06">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200 M0 420 H1200 M0 480 H1200 M0 540 H1200" stroke="#94a3b8" stroke-width="1" />
    <path d="M60 0 V630 M120 0 V630 M180 0 V630 M240 0 V630 M300 0 V630 M360 0 V630 M420 0 V630 M480 0 V630 M540 0 V630 M600 0 V630 M660 0 V630 M720 0 V630 M780 0 V630 M840 0 V630 M900 0 V630 M960 0 V630 M1020 0 V630 M1080 0 V630 M1140 0 V630" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#1e293b" />
    <text x="110" y="16" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">SOFTWARE ARCHITECTURE</text>
    <text x="0" y="54" fill="#f8fafc" font-size="26" font-weight="800" letter-spacing="-0.5">The PostgreSQL Standard &amp; Ecosystem</text>
    <text x="0" y="78" fill="#94a3b8" font-size="14" font-weight="400">Core System of Record (Single Source of Truth) + Purpose-Built Accelerators</text>
  </g>

  <!-- Flow Arrows / Connectors -->
  <!-- Connector: Cache to Postgres (Top) -->
  <path d="M600 215 V245" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.8" />
  <polygon points="600,250 595,240 605,240" fill="#f59e0b" />
  <rect x="530" y="222" width="140" height="18" rx="4" fill="#182234" stroke="#f59e0b" stroke-width="1" opacity="0.9" />
  <text x="600" y="234" fill="#fbbf24" font-size="9.5" font-weight="600" text-anchor="middle">Cache-Aside Pattern</text>

  <!-- Connector: Postgres to Analytics (Right) -->
  <path d="M790 365 H840" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.8" />
  <polygon points="845,365 835,360 835,370" fill="#10b981" />
  <rect x="794" y="342" width="46" height="18" rx="4" fill="#132a24" stroke="#10b981" stroke-width="1" opacity="0.9" />
  <text x="817" y="354" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">ETL/CDC</text>

  <!-- ================= TOP CARD: In-Memory Cache ================= -->
  <g transform="translate(430, 130)">
    <rect width="340" height="85" rx="12" fill="#141a29" stroke="url(#cacheBorder)" stroke-width="1.8" />
    <circle cx="28" cy="28" r="14" fill="#d97706" fill-opacity="0.2" />
    <text x="28" y="33" fill="#f59e0b" font-size="14" font-weight="800" text-anchor="middle">⚡</text>
    <text x="52" y="27" fill="#fbbf24" font-size="15" font-weight="700">In-Memory Cache (RAM)</text>
    <text x="52" y="44" fill="#f8fafc" font-size="13" font-weight="600">Valkey / Redis</text>
    <rect x="52" y="55" width="265" height="20" rx="4" fill="#0f172a" />
    <text x="60" y="68" fill="#94a3b8" font-size="10.5">Sub-millisecond reads | Ephemeral state | Sessions</text>
  </g>

  <!-- ================= LEFT CARD: Embedded SQLite ================= -->
  <g transform="translate(60, 260)">
    <rect width="290" height="190" rx="12" fill="#141a29" stroke="url(#edgeBorder)" stroke-width="1.8" />
    <circle cx="28" cy="30" r="14" fill="#6d28d9" fill-opacity="0.25" />
    <text x="28" y="35" fill="#a78bfa" font-size="13" font-weight="800" text-anchor="middle">📁</text>
    <text x="52" y="28" fill="#c4b5fd" font-size="15" font-weight="700">Embedded &amp; Serverless</text>
    <text x="52" y="46" fill="#f8fafc" font-size="14" font-weight="600">SQLite</text>
    <text x="24" y="80" fill="#94a3b8" font-size="11.5" font-weight="500">Standalone Local Architecture:</text>
    <g transform="translate(24, 94)">
      <rect x="0" y="0" width="242" height="22" rx="4" fill="#1e1b4b" fill-opacity="0.6" />
      <text x="10" y="15" fill="#e0e7ff" font-size="11">• Mobile Apps (iOS &amp; Android)</text>
      <rect x="0" y="28" width="242" height="22" rx="4" fill="#1e1b4b" fill-opacity="0.6" />
      <text x="10" y="43" fill="#e0e7ff" font-size="11">• Desktop &amp; CLI Tools</text>
      <rect x="0" y="56" width="242" height="22" rx="4" fill="#1e1b4b" fill-opacity="0.6" />
      <text x="10" y="71" fill="#e0e7ff" font-size="11">• Zero daemon, single-file ACID</text>
    </g>
  </g>

  <!-- ================= CENTER CARD: PostgreSQL ================= -->
  <g transform="translate(400, 250)">
    <!-- Soft background glow -->
    <rect x="-10" y="-10" width="410" height="235" rx="16" fill="#1d4ed8" opacity="0.12" filter="url(#glow)" />
    <!-- Main Card Body -->
    <rect width="390" height="215" rx="14" fill="#0f172a" stroke="url(#accentBorder)" stroke-width="2.5" />
    
    <!-- Header inside card -->
    <rect x="0" y="0" width="390" height="52" rx="14" fill="url(#primaryGlow)" />
    <circle cx="32" cy="26" r="14" fill="#2563eb" fill-opacity="0.3" />
    <text x="32" y="31" fill="#60a5fa" font-size="14" font-weight="800" text-anchor="middle">🐘</text>
    <text x="56" y="24" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="0.5">CORE TRANSACTIONAL ENGINE</text>
    <text x="56" y="42" fill="#ffffff" font-size="18" font-weight="800">PostgreSQL (Default)</text>

    <!-- Subtitle / Guarantees -->
    <text x="24" y="74" fill="#cbd5e1" font-size="12" font-weight="600">Full ACID • Open Source • Global SQL Ecosystem</text>

    <!-- Native Extension Pills -->
    <g transform="translate(24, 88)">
      <!-- Pill 1: JSONB -->
      <rect x="0" y="0" width="165" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="10" y="19" fill="#38bdf8" font-size="11" font-weight="700">JSONB + GIN</text>
      <text x="88" y="19" fill="#94a3b8" font-size="10.5">Documents</text>

      <!-- Pill 2: pgvector -->
      <rect x="175" y="0" width="167" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="185" y="19" fill="#a855f7" font-size="11" font-weight="700">pgvector</text>
      <text x="242" y="19" fill="#94a3b8" font-size="10.5">AI Vectors</text>

      <!-- Pill 3: PostGIS -->
      <rect x="0" y="36" width="165" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="10" y="55" fill="#34d399" font-size="11" font-weight="700">PostGIS</text>
      <text x="68" y="55" fill="#94a3b8" font-size="10.5">Geospatial</text>

      <!-- Pill 4: TimescaleDB -->
      <rect x="175" y="36" width="167" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="185" y="55" fill="#f59e0b" font-size="11" font-weight="700">TimescaleDB</text>
      <text x="265" y="55" fill="#94a3b8" font-size="10.5">IoT/Series</text>

      <!-- Pill 5: CTEs & Fulltext -->
      <rect x="0" y="72" width="342" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="10" y="89" fill="#f43f5e" font-size="11" font-weight="700">Recursive CTEs &amp; FTS</text>
      <text x="155" y="89" fill="#94a3b8" font-size="10.5">Trees, Hierarchies &amp; Full-Text Search</text>
    </g>
  </g>

  <!-- ================= RIGHT CARD: OLAP ClickHouse / DuckDB ================= -->
  <g transform="translate(845, 260)">
    <rect width="295" height="190" rx="12" fill="#141a29" stroke="url(#olapBorder)" stroke-width="1.8" />
    <circle cx="28" cy="30" r="14" fill="#059669" fill-opacity="0.25" />
    <text x="28" y="35" fill="#34d399" font-size="13" font-weight="800" text-anchor="middle">📊</text>
    <text x="52" y="28" fill="#6ee7b7" font-size="15" font-weight="700">Columnar Analytics (OLAP)</text>
    <text x="52" y="46" fill="#f8fafc" font-size="14" font-weight="600">ClickHouse / DuckDB</text>
    <text x="24" y="80" fill="#94a3b8" font-size="11.5" font-weight="500">Append-Only Data Warehouse:</text>
    <g transform="translate(24, 94)">
      <rect x="0" y="0" width="247" height="22" rx="4" fill="#064e3b" fill-opacity="0.5" />
      <text x="10" y="15" fill="#a7f3d0" font-size="11">• Aggregations across 10M+ rows</text>
      <rect x="0" y="28" width="247" height="22" rx="4" fill="#064e3b" fill-opacity="0.5" />
      <text x="10" y="43" fill="#a7f3d0" font-size="11">• Extreme columnar compression</text>
      <rect x="0" y="56" width="247" height="22" rx="4" fill="#064e3b" fill-opacity="0.5" />
      <text x="10" y="71" fill="#a7f3d0" font-size="11">• ClickHouse (Server) / DuckDB (Local)</text>
    </g>
  </g>

  <!-- ================= BOTTOM STRIP: Hyperscale Specialists ================= -->
  <g transform="translate(60, 485)">
    <rect width="1080" height="90" rx="10" fill="#0d1424" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="1080" height="26" rx="10" fill="#1e293b" fill-opacity="0.6" />
    <text x="20" y="17" fill="#cbd5e1" font-size="11" font-weight="700" letter-spacing="0.8">EXTREME HYPERSCALE &amp; EDGE CASES (SPECIALISTS ONLY)</text>
    
    <g transform="translate(20, 38)">
      <!-- Item 1: Cassandra -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#e2e8f0" font-size="12" font-weight="700">Cassandra / ScyllaDB</text>
        <text x="0" y="32" fill="#94a3b8" font-size="11">&gt;100k IoT writes/sec (Eventual Consistency)</text>
      </g>
      <!-- Item 2: CockroachDB / TiDB -->
      <g transform="translate(370, 0)">
        <text x="0" y="14" fill="#e2e8f0" font-size="12" font-weight="700">CockroachDB / TiDB</text>
        <text x="0" y="32" fill="#94a3b8" font-size="11">Multi-Region Distributed SQL (Global Consensus)</text>
      </g>
      <!-- Item 3: Neo4j -->
      <g transform="translate(750, 0)">
        <text x="0" y="14" fill="#e2e8f0" font-size="12" font-weight="700">Neo4j / Memgraph</text>
        <text x="0" y="32" fill="#94a3b8" font-size="11">Deep Graph Traversals (&gt;3 Hops / Fraud Rings)</text>
      </g>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(60, 605)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-weight="500">Pascal Thommen • Business Informatics</text>
    <text x="1080" y="0" fill="#64748b" font-size="11" font-weight="500" text-anchor="end">pascal-thommen.github.io</text>
  </g>
</svg>
