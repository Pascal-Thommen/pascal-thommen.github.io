baseURL: "https://pascal-thommen.github.io/"
title: "Pascal Thommen"
theme: "PaperMod"
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
copyright: "Pascal Thommen"

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  env: "production"
  defaultTheme: "auto"
  disableThemeToggle: false
  disableLangToggle: false
  displayFullLangName: true
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideMeta: false
  hideAuthor: true
  label:
    text: "Pascal Thommen"
  socialIcons:
    - name: "linkedin"
      url: "https://www.linkedin.com/in/pascal-thommen/"
      title: "LinkedIn"
    - name: "github"
      url: "https://github.com/Pascal-Thommen"
      title: "GitHub"

languages:
  en:
    label: "English"
    locale: "en-US"
    weight: 1
    title: "Pascal Thommen | Business Informatics"
    params:
      profileMode:
        enabled: true
        title: "Pascal Thommen"
        subtitle: "Business Informatics Specialist @ UPA | ERP Architecture & AI-driven System Engineering"
        imageUrl: "images/pascal_linkedin_profile.jpg"
        imageWidth: 160
        imageHeight: 160
        imageTitle: "Pascal Thommen"
        buttons:
          - name: "Projects"
            url: "/projects/"
          - name: "Articles"
            url: "/posts/"
          - name: "Contact"
            url: "/contact/"
    menu:
      main:
        - identifier: "projects"
          name: "Projects"
          url: "/projects/"
          weight: 10
        - identifier: "posts"
          name: "Articles"
          url: "/posts/"
          weight: 20
        - identifier: "contact"
          name: "Contact"
          url: "/contact/"
          weight: 30
  de:
    label: "Deutsch"
    locale: "de-DE"
    weight: 2
    title: "Pascal Thommen | Wirtschaftsinformatiker"
    params:
      profileMode:
        enabled: true
        title: "Pascal Thommen"
        subtitle: "Wirtschaftsinformatiker @ UPA | ERP-Architektur & AI-driven System Engineering"
        imageUrl: "images/pascal_linkedin_profile.jpg"
        imageWidth: 160
        imageHeight: 160
        imageTitle: "Pascal Thommen"
        buttons:
          - name: "Projekte"
            url: "/de/projects/"
          - name: "Artikel"
            url: "/de/posts/"
          - name: "Kontakt"
            url: "/de/contact/"
    menu:
      main:
        - identifier: "projects"
          name: "Projekte"
          url: "/de/projects/"
          weight: 10
        - identifier: "posts"
          name: "Artikel"
          url: "/de/posts/"
          weight: 20
        - identifier: "contact"
          name: "Kontakt"
          url: "/de/contact/"
          weight: 30
  es:
    label: "Español"
    locale: "es-PY"
    weight: 3
    title: "Pascal Thommen | Informática Empresarial"
    params:
      profileMode:
        enabled: true
        title: "Pascal Thommen"
        subtitle: "Informático Empresarial @ UPA | Arquitectura ERP e Ingeniería de Sistemas con IA"
        imageUrl: "images/pascal_linkedin_profile.jpg"
